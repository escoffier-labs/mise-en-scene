3.org/1999/xhtml"><span>Coder seat</span></div></foreignObject></g></g><g><line x1="714.5" y1="152" x2="714.5" y2="736" class="lifeline"></line><g data-block-id="mcp-sidecars" role="button" tabindex="0" aria-label="MCP sidecars" class="scene-block active   "><rect x="650" y="92" width="129" height="60" rx="9" class="card-rect"></rect><foreignObject x="650" y="92" width="129" height="60"><div class="participant" xmlns="http://www.w3.org/1999/xhtml"><span>MCP sidecars</span></div></foreignObject></g></g><g><line x1="863.5" y1="152" x2="863.5" y2="736" class="lifeline"></line><g data-block-id="reviewer-seat" role="button" tabindex="0" aria-label="Reviewer seat" class="scene-block active   "><rect x="799" y="92" width="129" height="60" rx="9" class="card-rect"></rect><foreignObject x="799" y="92" width="129" height="60"><div class="participant" xmlns="http://www.w3.org/1999/xhtml"><span>Reviewer seat</span></div></foreignObject></g></g><g><line x1="1012.5" y1="152" x2="1012.5" y2="736" class="lifeline"></line><g data-block-id="verification" role="button" tabindex="0" aria-label="Verification" class="scene-block active   "><rect x="948" y="92" width="129" height="60" rx="9" class="card-rect"></rect><foreignObject x="948" y="92" width="129" height="60"><div class="participant" xmlns="http://www.w3.org/1999/xhtml"><span>Verification</span></div></foreignObject></g></g><g><line x1="1161.5" y1="152" x2="1161.5" y2="736" class="lifeline"></line><g data-block-id="outcome-database" role="button" tabindex="0" aria-label="Outcome database" class="scene-block active   "><rect x="1097" y="92" width="129" height="60" rx="9" class="card-rect"></rect><foreignObject x="1097" y="92" width="129" height="60"><div class="participant" xmlns="http://www.w3.org/1999/xhtml"><span>Outcome database</span></div></foreignObject></g></g><g data-edge-id="user-brigade-cli-runs-a-task" role="button" class="flow active   "><text x="193" y="199" text-anchor="middle" class="flow-label">runs a task</text>