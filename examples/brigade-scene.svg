<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" role="group" aria-label="Brigade orchestration architecture scene"><style>
.scene-title {
  fill: #dde3ea;
  font-family: Inter, system-ui, sans-serif;
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
}

.scene-summary {
  fill: #7d8590;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.scene-meta {
  fill: #5c6672;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.04em;
}

.zone-frame {
  fill: none;
  stroke: #232b34;
  stroke-dasharray: 4 5;
  stroke-width: 1;
}

.zone-title {
  fill: #9aa4b2;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.14em;
}

.zone-desc {
  fill: #5c6672;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.02em;
}

.scene-mode {
  cursor: pointer;
}

.scene-mode rect {
  fill: #11161c;
  stroke: #2a323d;
}

.scene-mode:hover rect {
  stroke: #43505e;
}

.scene-mode .scene-mode-active {
  fill: #e0a45c;
  stroke: #e0a45c;
}

.scene-mode-text {
  fill: #9aa4b2;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 500;
}

.scene-mode-text-active {
  fill: #0d1014;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  font-weight: 600;
}

.flow path {
  fill: none;
  stroke: #38424e;
  stroke-width: 1.1;
}

.flow.dashed path {
  stroke-dasharray: 4 5;
}

.flow {
  opacity: 0.35;
}

.flow.active {
  opacity: 1;
}

.flow.active path {
  stroke: #e0a45c;
  stroke-width: 1.4;
}

.selected path,
.selected .card-rect {
  stroke: #e0a45c;
  stroke-width: 2.5;
}

.ungrounded {
  opacity: 0.22;
}

.lifeline {
  stroke: #2a323d;
  stroke-width: 1;
  stroke-dasharray: 4 5;
}

.flow-label {
  fill: #7d8590;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10px;
  letter-spacing: 0.02em;
  paint-order: stroke;
  stroke: #0d1014;
  stroke-width: 5px;
  stroke-linejoin: round;
}

.flow.active .flow-label {
  fill: #e0a45c;
}

.scene-block {
  cursor: pointer;
  opacity: 0.35;
}

.scene-block.active,
.scene-block.selected {
  opacity: 1;
}

.card-rect {
  fill: #121821;
  stroke: #2a323d;
  stroke-width: 1;
}

.scene-block:hover .card-rect {
  stroke: #43505e;
}

.scene-block.selected .card-rect {
  stroke: #e0a45c;
  stroke-width: 1.3;
}

.card {
  padding: 13px 16px;
  pointer-events: none;
}

.card h3 {
  margin: 0 0 5px;
  overflow: hidden;
  color: #dde3ea;
  font-family: Inter, system-ui, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card p {
  display: -webkit-box;
  margin: 0;
  overflow: hidden;
  color: #9aa4b2;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px;
  line-height: 1.5;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
}

.callout rect {
  fill: #11161c;
  stroke: #9c6f3a;
  stroke-width: 1;
}

.callout-title {
  fill: #e0a45c;
  font-family: Inter, system-ui, sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.01em;
}

.callout p {
  margin: 0;
  color: #9aa4b2;
  font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 10.5px;
  line-height: 1.5;
}

/* Dimming and spotlight overrides. These are compound and placed last so they
   win the specificity tie against .scene-block.active / .flow.active (which pin
   opacity to 1). "ungrounded" is the Review-evidence filter; "walk-*" is the
   walkthrough spotlight applied by the animated HTML player and the video
   recorder. Inert until a class is set, so the live studio is unaffected. */
.stage-camera {
  transform-box: view-box;
  transform-origin: 0 0;
}
.scene-block {
  transform-box: fill-box;
  transform-origin: center;
}
.scene-block.ungrounded,
.flow.ungrounded {
  opacity: 0.22;
}
.scene-block.walk-dim,
.flow.walk-dim {
  opacity: 0.14;
  transition: opacity 0.4s ease;
}
.scene-block.walk-on,
.flow.walk-on {
  opacity: 1;
  transition: opacity 0.4s ease, transform 0.4s cubic-bezier(0.22, 1, 0.36, 1);
}
.scene-block.walk-on {
  transform: scale(1.05);
}
.scene-block.walk-on .card-rect {
  stroke: #e0a45c;
  stroke-width: 2.5;
  filter: drop-shadow(0 6px 16px rgba(224, 164, 92, 0.35));
}
.flow.walk-on path {
  stroke: #e0a45c;
  stroke-width: 2.6;
  filter: drop-shadow(0 0 6px rgba(224, 164, 92, 0.45));
}
.flow.walk-on .flow-label {
  fill: #e0a45c;
  font-weight: 600;
}
